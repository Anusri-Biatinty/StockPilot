spring:
  application:
    name: stockpilot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Reads KEY=VALUE pairs from a .env file in the repository root or the backend folder, if present.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stockpilot}
    username: ${DB_USERNAME:stockpilot}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads lazy associations/collections in batches, avoiding N+1 queries on list pages.
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Only probe SMTP when email notifications are actually enabled.
    mail:
      enabled: ${MAIL_ENABLED:false}
  info:
    env:
      enabled: true

info:
  app:
    name: StockPilot
    version: 1.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  jwt:
    # No default: production must provide JWT_SECRET (base64, >= 32 bytes decoded).
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    cookie-secure: ${COOKIE_SECURE:true}
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:stockpilot@localhost}

logging:
  level:
    com.stockpilot: INFO
